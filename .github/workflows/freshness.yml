name: Freshness check

# Two outages (2026-07-09..07-16 and 2026-09-05..09-11, 15 builds) went unnoticed because a
# stale release is indistinguishable from a fresh one: the URL still returns 200 and the
# published sha256sums still verify. This job fails loudly, and GitHub emails the owner when a
# scheduled workflow fails.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Latest release must be fresh
    runs-on: ubuntu-latest
    steps:
      - name: Release younger than 36h
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published=$(gh release view --repo "${{ github.repository }}" \
            --json publishedAt --jq .publishedAt)
          age=$(( ($(date -u +%s) - $(date -u -d "$published" +%s)) / 3600 ))
          echo "Latest release published $published (${age}h ago)"
          if [ "$age" -gt 36 ]; then
            echo "::error::latest release is ${age}h old — the nightly build is not publishing"
            exit 1
          fi

      - name: release branch matches the release
        run: |
          fail=0
          for f in geosite.dat geoip.dat; do
            curl -fsSL -o "/tmp/rel-$f" \
              "https://github.com/${{ github.repository }}/releases/latest/download/$f"
            curl -fsSL -o "/tmp/raw-$f" \
              "https://raw.githubusercontent.com/${{ github.repository }}/release/$f"
            if cmp -s "/tmp/rel-$f" "/tmp/raw-$f"; then
              echo "$f: release and the release branch agree ($(stat -c%s "/tmp/rel-$f") bytes)"
            else
              echo "::error::$f differs between the release and the release branch"
              fail=1
            fi
          done
          exit "$fail"

      # jsDelivr caches branch refs with s-maxage=43200 and its purge API does not reliably
      # flush the branch-to-content mapping, so it lags by design. Warn, never fail: a check
      # that goes red every morning is a check nobody reads.
      - name: jsDelivr lag (informational)
        continue-on-error: true
        run: |
          want=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/release/version.json" \
                 | sed -n 's/.*"built_at":"\([^"]*\)".*/\1/p')
          got=$(curl -fsSL "https://cdn.jsdelivr.net/gh/${{ github.repository }}@release/version.json" \
                 | sed -n 's/.*"built_at":"\([^"]*\)".*/\1/p')
          echo "release branch: $want"
          echo "jsDelivr:       $got"
          if [ "$want" = "$got" ]; then
            echo "jsDelivr is current"
          else
            lag=$(( ($(date -u -d "$want" +%s) - $(date -u -d "$got" +%s)) / 3600 ))
            echo "::warning::jsDelivr is ${lag}h behind the release branch"
          fi
